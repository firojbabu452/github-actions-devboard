name: Go linter

on:
 workflow_dispatch:


 jobs:
   code-format:
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        matrix:
          go-version: ['1.23', '1.22', '1.21']
      steps:
  
        - name: Set up Go
          uses: actions/setup-go@v4
          with:
            go-version: ${{ matrix.go-version }}
            go-version-file: 'go.mod'
            cache-dependency-path: go.sum
  
        - name: Run go Formatter
          run: go fmt
          working-directory: backend

        - name: Run go vet
          run: go vet
          working-directory: backend

      